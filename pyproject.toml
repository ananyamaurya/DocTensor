[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doctensor"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2",
    "pymupdf",
    "pdfplumber",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "pillow",
    "numpy",
    "opencv-python",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pyyaml",
    "typer",
]

[project.optional-dependencies]
ocr = [
    "paddleocr",
]

ml = [
    "torch",
    "transformers",
]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]
