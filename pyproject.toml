[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doctensor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pymupdf",
    "pdfplumber",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "pillow",
    "numpy",
    "opencv-python",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pyyaml",
    "typer",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle==2.6.2"
]
math = [
    "pix2tex>=0.1.0"
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "pydantic-settings>=2.2.1"
]
s3 = [
    "boto3>=1.34.60"
]
mcp = [
    "mcp>=1.0.0",
    "fastmcp>=3.4.0"
]
ml = [
    "torch",
    "transformers",
]

eval = [
    "Levenshtein",
    "nltk",
    "sacrebleu"
]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
doctensor = "doctensor.cli:app"
doctensor-mcp = "doctensor.mcp_server:main"
