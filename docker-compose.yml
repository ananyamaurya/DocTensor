version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tmp_uploads:/app/tmp_uploads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_ROOT=/app/tmp_uploads
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A doctensor.worker.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./src:/app/src
      - ./tmp_uploads:/app/tmp_uploads
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_ROOT=/app/tmp_uploads
    depends_on:
      - redis

volumes:
  redis_data:
